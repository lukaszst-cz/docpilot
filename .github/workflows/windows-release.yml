name: Windows Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[full,dev]'
          pip install pyinstaller
      - name: Install Tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $tess = 'C:\Program Files\Tesseract-OCR'
          if (!(Test-Path $tess)) { throw 'Tesseract was not installed.' }
          Invoke-WebRequest -Uri 'https://github.com/tesseract-ocr/tessdata_fast/raw/main/pol.traineddata' -OutFile "$tess\tessdata\pol.traineddata"
      - name: Run tests
        run: pytest -q
      - name: Build DocPilot Desktop
        run: pyinstaller packaging/docpilot.spec --noconfirm
      - name: Build background notifier
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --name DocPilotNotifier --distpath dist\notifier packaging\notifier_entry.py
          Copy-Item 'dist\notifier\DocPilotNotifier.exe' 'dist\DocPilot\DocPilotNotifier.exe'
      - name: Bundle OCR engine
        shell: pwsh
        run: |
          Copy-Item 'C:\Program Files\Tesseract-OCR' 'dist\DocPilot\tesseract' -Recurse
      - name: Smoke test package imports
        shell: pwsh
        run: |
          python -c "from docpilot.app import app; print(app.title, app.version)"
          python -c "from docpilot.semantic import semantic_rank; from docpilot.review import build_review_queue; print('feature imports ok')"
      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist\DocPilot\*' -DestinationPath 'DocPilot-Portable-Windows-x64.zip'
      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-installer | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' packaging\installer\DocPilot.iss
      - name: Generate checksums
        shell: pwsh
        run: |
          $files = @('DocPilot-Portable-Windows-x64.zip','dist-installer\DocPilot-Setup-Windows-x64.exe')
          $lines = foreach ($f in $files) { $h=(Get-FileHash $f -Algorithm SHA256).Hash.ToLower(); "$h  $([IO.Path]::GetFileName($f))" }
          $lines | Set-Content SHA256SUMS.txt
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DocPilot-Windows
          path: |
            DocPilot-Portable-Windows-x64.zip
            dist-installer/DocPilot-Setup-Windows-x64.exe
            SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            DocPilot-Portable-Windows-x64.zip
            dist-installer/DocPilot-Setup-Windows-x64.exe
            SHA256SUMS.txt
