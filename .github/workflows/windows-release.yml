name: Windows Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '.github/workflows/windows-release.yml'
      - 'packaging/**'
      - '*.py'
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.webmanifest'
      - '*.png'
      - 'pyproject.toml'
      - 'test_*.py'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[full,dev]'
          pip install pyinstaller

      - name: Install Tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $tess = 'C:\Program Files\Tesseract-OCR'
          if (!(Test-Path $tess)) { throw 'Tesseract was not installed.' }
          Invoke-WebRequest -Uri 'https://github.com/tesseract-ocr/tessdata_fast/raw/main/pol.traineddata' -OutFile "$tess\tessdata\pol.traineddata"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup was not installed.' }

      - name: Run tests
        run: pytest -q

      - name: Build DocPilot Desktop
        run: pyinstaller packaging/docpilot.spec --noconfirm

      - name: Build background notifier
        shell: pwsh
        run: |
          $parent = (Resolve-Path '..').Path
          pyinstaller --onefile --windowed --name DocPilotNotifier --paths $parent --distpath dist\notifier notifier_entry.py
          Copy-Item 'dist\notifier\DocPilotNotifier.exe' 'dist\DocPilot\DocPilotNotifier.exe'

      - name: Bundle OCR engine
        shell: pwsh
        run: |
          Copy-Item 'C:\Program Files\Tesseract-OCR' 'dist\DocPilot\tesseract' -Recurse

      - name: Verify packaged files
        shell: pwsh
        run: |
          $required = @(
            'dist\DocPilot\DocPilot.exe',
            'dist\DocPilot\DocPilotNotifier.exe',
            'dist\DocPilot\tesseract\tesseract.exe'
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Missing packaged file: $file" }
          }

      - name: Self-test packaged DocPilot
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'dist\DocPilot\DocPilot.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged DocPilot self-test failed with exit code $($p.ExitCode)." }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist\DocPilot\*' -DestinationPath 'DocPilot-Portable-Windows-x64.zip'

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-installer | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' packaging\installer\DocPilot.iss

      - name: Upgrade smoke test from v0.5.1
        shell: pwsh
        run: |
          $oldInstaller = Join-Path $env:TEMP 'DocPilot-Setup-v0.5.1.exe'
          Invoke-WebRequest -Uri 'https://github.com/lukaszst-cz/docpilot/releases/download/v0.5.1/DocPilot-Setup-Windows-x64.exe' -OutFile $oldInstaller

          $silentArgs = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-')
          $old = Start-Process -FilePath $oldInstaller -ArgumentList $silentArgs -Wait -PassThru
          if ($old.ExitCode -ne 0) { throw "v0.5.1 installer failed with exit code $($old.ExitCode)." }

          $dataRoot = Join-Path $env:LOCALAPPDATA 'DocPilot\Data'
          New-Item -ItemType Directory -Force -Path $dataRoot | Out-Null
          $marker = Join-Path $dataRoot 'upgrade-smoke-test.txt'
          'keep-me' | Set-Content -Path $marker -Encoding UTF8

          $newInstaller = (Resolve-Path 'dist-installer\DocPilot-Setup-Windows-x64.exe').Path
          $new = Start-Process -FilePath $newInstaller -ArgumentList $silentArgs -Wait -PassThru
          if ($new.ExitCode -ne 0) { throw "Current installer failed with exit code $($new.ExitCode)." }

          if (!(Test-Path $marker)) { throw 'Upgrade removed the existing DocPilot data folder.' }
          $markerValue = (Get-Content $marker -Raw).Trim()
          if ($markerValue -ne 'keep-me') { throw 'Upgrade changed existing user data.' }

          $installedExe = Join-Path $env:LOCALAPPDATA 'Programs\DocPilot\DocPilot.exe'
          if (!(Test-Path $installedExe)) { throw 'Upgraded DocPilot.exe was not installed.' }
          $selfTest = Start-Process -FilePath $installedExe -ArgumentList '--self-test' -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) { throw "Upgraded DocPilot self-test failed with exit code $($selfTest.ExitCode)." }

      - name: Generate checksums
        shell: pwsh
        run: |
          $files = @('DocPilot-Portable-Windows-x64.zip','dist-installer\DocPilot-Setup-Windows-x64.exe')
          $lines = foreach ($f in $files) {
            $h=(Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$h  $([IO.Path]::GetFileName($f))"
          }
          $lines | Set-Content SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DocPilot-Windows
          path: |
            DocPilot-Portable-Windows-x64.zip
            dist-installer/DocPilot-Setup-Windows-x64.exe
            SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DocPilot ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
          files: |
            DocPilot-Portable-Windows-x64.zip
            dist-installer/DocPilot-Setup-Windows-x64.exe
            SHA256SUMS.txt
