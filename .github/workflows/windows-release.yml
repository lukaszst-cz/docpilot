name: Windows Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '.github/workflows/windows-release.yml'
      - 'packaging/**'
      - '*.py'
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.webmanifest'
      - '*.png'
      - 'pyproject.toml'
      - 'test_*.py'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed.' }

          python -m pip install --retries 10 --timeout 60 -e '.[full,dev]'
          if ($LASTEXITCODE -ne 0) { throw 'DocPilot dependency installation failed.' }

          python -m pip install --retries 10 --timeout 60 pyinstaller
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller installation failed.' }

      - name: Install Tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $tess = 'C:\Program Files\Tesseract-OCR'
          if (!(Test-Path $tess)) { throw 'Tesseract was not installed.' }
          Invoke-WebRequest -Uri 'https://github.com/tesseract-ocr/tessdata_fast/raw/main/pol.traineddata' -OutFile "$tess\tessdata\pol.traineddata"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup was not installed.' }

      - name: Check frontend syntax
        run: node --check app.js

      - name: Run tests
        run: python -m pytest -q

      - name: Build DocPilot Desktop
        run: pyinstaller packaging/docpilot.spec --noconfirm

      - name: Build background notifier
        shell: pwsh
        run: |
          $parent = (Resolve-Path '..').Path
          pyinstaller --onefile --windowed --name DocPilotNotifier --paths $parent --distpath dist\notifier notifier_entry.py
          Copy-Item 'dist\notifier\DocPilotNotifier.exe' 'dist\DocPilot\DocPilotNotifier.exe'

      - name: Bundle OCR engine
        shell: pwsh
        run: |
          Copy-Item 'C:\Program Files\Tesseract-OCR' 'dist\DocPilot\tesseract' -Recurse

      - name: Verify packaged files
        shell: pwsh
        run: |
          $required = @(
            'dist\DocPilot\DocPilot.exe',
            'dist\DocPilot\DocPilotNotifier.exe',
            'dist\DocPilot\tesseract\tesseract.exe'
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Missing packaged file: $file" }
          }

      - name: Self-test packaged DocPilot
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'dist\DocPilot\DocPilot.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged DocPilot self-test failed with exit code $($p.ExitCode)." }

      - name: Smoke-test packaged LifePilot Pilot
        shell: pwsh
        run: |
          $pilotSource = Join-Path $env:RUNNER_TEMP 'lifepilot-pilot-source-packaged'
          $pilotOutput = Join-Path $env:RUNNER_TEMP 'lifepilot-pilot-output-packaged'
          New-Item -ItemType Directory -Force -Path $pilotSource | Out-Null
          Remove-Item -Path $pilotOutput -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item 'sample_invoice.txt' (Join-Path $pilotSource 'private-sample-name.txt')

          $pilotArgs = @('--pilot', ('"' + $pilotSource + '"'), '--output', ('"' + $pilotOutput + '"'))
          $pilot = Start-Process -FilePath 'dist\DocPilot\DocPilot.exe' -ArgumentList $pilotArgs -Wait -PassThru
          if ($pilot.ExitCode -ne 0) { throw "Packaged LifePilot Pilot failed with exit code $($pilot.ExitCode)." }

          $public = Join-Path $pilotOutput 'pilot-public.json'
          $markdown = Join-Path $pilotOutput 'pilot-report.md'
          $private = Join-Path $pilotOutput 'pilot-private.json'
          if (!(Test-Path $public)) { throw 'LifePilot Pilot did not create pilot-public.json.' }
          if (!(Test-Path $markdown)) { throw 'LifePilot Pilot did not create pilot-report.md.' }
          if (Test-Path $private) { throw 'LifePilot Pilot created a private report without explicit opt-in.' }

          $payload = Get-Content $public -Raw | ConvertFrom-Json
          if ($payload.processed -ne 1 -or $payload.failed -ne 0) { throw 'LifePilot Pilot returned an unexpected processed/failed count.' }
          $publicText = Get-Content $public -Raw
          if ($publicText -match 'private-sample-name' -or $publicText -match [regex]::Escape($pilotSource)) {
            throw 'LifePilot Pilot public report exposed a filename or local source path.'
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist\DocPilot\*' -DestinationPath 'DocPilot-Portable-Windows-x64.zip'

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-installer | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' packaging\installer\DocPilot.iss

      - name: Clean install and uninstall smoke test
        shell: pwsh
        run: |
          $installer = (Resolve-Path 'dist-installer\DocPilot-Setup-Windows-x64.exe').Path
          $silentArgs = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-')
          $install = Start-Process -FilePath $installer -ArgumentList $silentArgs -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Clean install failed with exit code $($install.ExitCode)." }

          $programDir = Join-Path $env:LOCALAPPDATA 'Programs\DocPilot'
          $installedExe = Join-Path $programDir 'DocPilot.exe'
          $uninstaller = Join-Path $programDir 'unins000.exe'
          if (!(Test-Path $installedExe)) { throw 'Clean install did not create DocPilot.exe.' }
          if (!(Test-Path $uninstaller)) { throw 'Clean install did not create the uninstaller.' }

          $startMenuRoot = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          $shortcut = Get-ChildItem -Path $startMenuRoot -Filter 'DocPilot.lnk' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$shortcut) { throw 'Clean install did not create the Start menu shortcut.' }
          $pilotShortcut = Get-ChildItem -Path $startMenuRoot -Filter 'LifePilot Pilot.lnk' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$pilotShortcut) { throw 'Clean install did not create the LifePilot Pilot Start menu shortcut.' }

          $selfTest = Start-Process -FilePath $installedExe -ArgumentList '--self-test' -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) { throw "Clean-installed DocPilot self-test failed with exit code $($selfTest.ExitCode)." }

          $pilotSource = Join-Path $env:RUNNER_TEMP 'lifepilot-pilot-source-installed'
          $pilotOutput = Join-Path $env:RUNNER_TEMP 'lifepilot-pilot-output-installed'
          New-Item -ItemType Directory -Force -Path $pilotSource | Out-Null
          Remove-Item -Path $pilotOutput -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item 'sample_invoice.txt' (Join-Path $pilotSource 'installed-private-name.txt')
          $pilotArgs = @('--pilot', ('"' + $pilotSource + '"'), '--output', ('"' + $pilotOutput + '"'))
          $pilotRun = Start-Process -FilePath $installedExe -ArgumentList $pilotArgs -Wait -PassThru
          if ($pilotRun.ExitCode -ne 0) { throw "Clean-installed LifePilot Pilot failed with exit code $($pilotRun.ExitCode)." }
          if (!(Test-Path (Join-Path $pilotOutput 'pilot-public.json'))) { throw 'Clean-installed LifePilot Pilot did not create the public report.' }
          if (Test-Path (Join-Path $pilotOutput 'pilot-private.json')) { throw 'Clean-installed LifePilot Pilot created a private report without opt-in.' }

          $dataRoot = Join-Path $env:LOCALAPPDATA 'DocPilot\Data'
          New-Item -ItemType Directory -Force -Path $dataRoot | Out-Null
          $marker = Join-Path $dataRoot 'uninstall-preserves-data.txt'
          'keep-after-uninstall' | Set-Content -Path $marker -Encoding UTF8

          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList $silentArgs -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed with exit code $($uninstall.ExitCode)." }
          if (Test-Path $installedExe) { throw 'Uninstall left DocPilot.exe installed.' }
          if (!(Test-Path $marker)) { throw 'Uninstall removed the DocPilot data folder.' }
          if ((Get-Content $marker -Raw).Trim() -ne 'keep-after-uninstall') { throw 'Uninstall changed existing user data.' }

          # Keep the following upgrade test independent from the clean-install test.
          Remove-Item -Path $dataRoot -Recurse -Force

      - name: Upgrade smoke test from stable v4.0.0
        shell: pwsh
        run: |
          $oldInstaller = Join-Path $env:TEMP 'DocPilot-Setup-v4.0.0.exe'
          Invoke-WebRequest -Uri 'https://github.com/lukaszst-cz/docpilot/releases/download/v4.0.0/DocPilot-Setup-Windows-x64.exe' -OutFile $oldInstaller

          $silentArgs = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-')
          $old = Start-Process -FilePath $oldInstaller -ArgumentList $silentArgs -Wait -PassThru
          if ($old.ExitCode -ne 0) { throw "v4.0.0 installer failed with exit code $($old.ExitCode)." }

          $oldExe = Join-Path $env:LOCALAPPDATA 'Programs\DocPilot\DocPilot.exe'
          if (!(Test-Path $oldExe)) { throw 'v4.0.0 DocPilot.exe was not installed.' }
          $oldSelfTest = Start-Process -FilePath $oldExe -ArgumentList '--self-test' -Wait -PassThru
          if ($oldSelfTest.ExitCode -ne 0) { throw "v4.0.0 self-test failed with exit code $($oldSelfTest.ExitCode)." }

          $dataRoot = Join-Path $env:LOCALAPPDATA 'DocPilot\Data'
          $legacyDb = Join-Path $dataRoot 'state\docpilot.sqlite3'
          if (!(Test-Path $legacyDb)) { throw 'v4.0.0 did not initialize its SQLite database.' }

          $marker = Join-Path $dataRoot 'upgrade-smoke-test.txt'
          'keep-me' | Set-Content -Path $marker -Encoding UTF8

          $newInstaller = (Resolve-Path 'dist-installer\DocPilot-Setup-Windows-x64.exe').Path
          $new = Start-Process -FilePath $newInstaller -ArgumentList $silentArgs -Wait -PassThru
          if ($new.ExitCode -ne 0) { throw "Current installer failed with exit code $($new.ExitCode)." }

          if (!(Test-Path $marker)) { throw 'Upgrade removed the existing DocPilot data folder.' }
          $markerValue = (Get-Content $marker -Raw).Trim()
          if ($markerValue -ne 'keep-me') { throw 'Upgrade changed existing user data.' }

          $installedExe = Join-Path $env:LOCALAPPDATA 'Programs\DocPilot\DocPilot.exe'
          if (!(Test-Path $installedExe)) { throw 'Upgraded DocPilot.exe was not installed.' }
          $selfTest = Start-Process -FilePath $installedExe -ArgumentList '--self-test' -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) { throw "Upgraded DocPilot self-test failed with exit code $($selfTest.ExitCode)." }

          $startMenuRoot = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          $pilotShortcut = Get-ChildItem -Path $startMenuRoot -Filter 'LifePilot Pilot.lnk' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$pilotShortcut) { throw 'Upgrade did not create the LifePilot Pilot Start menu shortcut.' }

          $pilotSource = Join-Path $env:RUNNER_TEMP 'lifepilot-pilot-source-upgraded'
          $pilotOutput = Join-Path $env:RUNNER_TEMP 'lifepilot-pilot-output-upgraded'
          New-Item -ItemType Directory -Force -Path $pilotSource | Out-Null
          Remove-Item -Path $pilotOutput -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item 'sample_invoice.txt' (Join-Path $pilotSource 'upgraded-private-name.txt')
          $pilotArgs = @('--pilot', ('"' + $pilotSource + '"'), '--output', ('"' + $pilotOutput + '"'))
          $pilotRun = Start-Process -FilePath $installedExe -ArgumentList $pilotArgs -Wait -PassThru
          if ($pilotRun.ExitCode -ne 0) { throw "Upgraded LifePilot Pilot failed with exit code $($pilotRun.ExitCode)." }
          if (!(Test-Path (Join-Path $pilotOutput 'pilot-public.json'))) { throw 'Upgraded LifePilot Pilot did not create the public report.' }
          if (Test-Path (Join-Path $pilotOutput 'pilot-private.json')) { throw 'Upgraded LifePilot Pilot created a private report without opt-in.' }

      - name: Generate checksums
        shell: pwsh
        run: |
          $files = @('DocPilot-Portable-Windows-x64.zip','dist-installer\DocPilot-Setup-Windows-x64.exe')
          $lines = foreach ($f in $files) {
            $h=(Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$h  $([IO.Path]::GetFileName($f))"
          }
          $lines | Set-Content SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DocPilot-Windows
          path: |
            DocPilot-Portable-Windows-x64.zip
            dist-installer/DocPilot-Setup-Windows-x64.exe
            SHA256SUMS.txt

      - name: Resolve stable release version
        id: release_meta
        shell: pwsh
        run: |
          $version = (python -c "import pathlib, tomllib; data=tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8')); print(data['project']['version'])").Trim()
          $stable = "false"
          try {
            $parsed = [version]$version
            if ($parsed.ToString() -eq $version) { $stable = "true" }
          } catch {
            $stable = "false"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "stable=$stable" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Validate tagged release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $expected = "${{ steps.release_meta.outputs.tag }}"
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "Git tag ${{ github.ref_name }} does not match package version $expected."
          }

      - name: Check stable release tag
        id: release_tag
        if: github.ref == 'refs/heads/main' && steps.release_meta.outputs.stable == 'true'
        shell: pwsh
        run: |
          git fetch --tags --force
          $tag = "${{ steps.release_meta.outputs.tag }}"
          $match = git tag --list $tag
          if ($match) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Create stable release tag
        if: github.ref == 'refs/heads/main' && steps.release_meta.outputs.stable == 'true' && steps.release_tag.outputs.exists == 'false'
        shell: pwsh
        run: |
          $tag = "${{ steps.release_meta.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $tag $env:GITHUB_SHA -m "DocPilot $tag"
          git push origin $tag

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && steps.release_meta.outputs.stable == 'true' && steps.release_tag.outputs.exists == 'false')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: DocPilot ${{ steps.release_meta.outputs.tag }}
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
          files: |
            DocPilot-Portable-Windows-x64.zip
            dist-installer/DocPilot-Setup-Windows-x64.exe
            SHA256SUMS.txt
